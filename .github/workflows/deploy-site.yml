name: Deploy Playground

on:
  push:
    branches:
      - docs-deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 16
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build site
        run: bash scripts/build-site.sh
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Verify site
        run: bash scripts/verify-site.sh doc-site

      - name: Add CNAME and .nojekyll
        run: |
          echo "designable-antd.bugduo.com" > doc-site/CNAME
          touch doc-site/.nojekyll
          ls -la doc-site | head -30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
